<div class="fb-page">
  <header class="fb-intro">
    <div>
      <p class="fb-crumbs">
        <span>Workspace</span>
        <i class="fa fa-angle-right" aria-hidden="true"></i>
        <span class="is-current">{{ pageTitle }}</span>
      </p>
      <h1 class="fb-title">{{ pageTitle }}</h1>
      <p class="fb-lede">{{ pageTitle }} in Brand Center</p>
    </div>
    <span class="fb-status"><span class="fb-status__dot" aria-hidden="true"></span>All systems operational</span>
  </header>

  <div class="fb-toolbar">
    <button type="button" class="fb-outline" (click)="goToProductPage()">
      <i class="fa fa-arrow-left" aria-hidden="true"></i>
      Back
    </button>
    <span class="fb-badge" *ngIf="formStatus" [class.fb-badge--active]="isPublished()" [class.fb-badge--draft]="!isPublished()">
      {{ getStatusDisplay(formStatus) }}
    </span>
    <div class="fb-toolbar__actions">
      <a class="fb-outline" [routerLink]="['/preview', form_id]" *ngIf="form_id">
        <i class="fa fa-eye" aria-hidden="true"></i>
        Preview
      </a>
      <button
        *ngIf="!isPublished() && formId"
        type="button"
        class="fb-btn"
        [disabled]="isPublishing"
        (click)="publishForm()"
      >
        {{ isPublishing ? 'Publishing...' : 'Publish' }}
      </button>
      <button
        *ngIf="isPublished() && formId"
        type="button"
        class="fb-outline fb-outline--danger"
        [disabled]="isUnpublishing"
        (click)="unpublishForm()"
      >
        {{ isUnpublishing ? 'Unpublishing...' : 'Unpublish' }}
      </button>
    </div>
  </div>

  <div class="fb-grid" [class.fb-grid--locked]="isPublished()">
    <section class="fb-card">
      <ng-container *ngIf="formDef$ | async as form">
        <label class="fb-field">
          Form name
          <input
            type="text"
            maxlength="80"
            [value]="form.title"
            [disabled]="isPublished()"
            (input)="onTitleChange($any($event.target).value)"
          />
        </label>
      </ng-container>
      <h3 class="fb-card__title">Fields</h3>
      <app-form-canvas
        mode="list"
        [form_json_data]="form_json_data"
        [formStatus]="formStatus"
      ></app-form-canvas>
      <ng-container *ngIf="!isPublished()">
        <p class="fb-add-label">Add field</p>
        <app-form-elements-panel></app-form-elements-panel>
      </ng-container>
    </section>

    <section class="fb-card" *ngIf="!isPublished()">
      <app-properties-panel></app-properties-panel>
    </section>

    <section class="fb-card">
      <div class="fb-preview-head">
        <i class="fa fa-eye" aria-hidden="true"></i>
        <h3 class="fb-card__title">Live preview</h3>
      </div>
      <app-form-canvas mode="preview" [formStatus]="formStatus"></app-form-canvas>
    </section>
  </div>
</div>
