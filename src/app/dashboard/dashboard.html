<div
  class="dashboard-layout"
  [class.dashboard-layout--collapsed]="sidebarCollapsed && !mobileSidebarOpen"
  [class.dashboard-layout--mobile-open]="mobileSidebarOpen"
>
  @if (mobileSidebarOpen) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation menu"
      (click)="closeMobileSidebar()"
    ></button>
  }

  <aside class="dashboard-sidebar" [class.dashboard-sidebar--collapsed]="sidebarCollapsed">
    <div class="sidebar-brand">
      <span class="sidebar-brand__mark" aria-hidden="true">R</span>
      <div class="sidebar-brand__text">
        <h1 class="sidebar-brand__title">Revo Admin</h1>
        <p class="sidebar-brand__subtitle">{{ sidebarSubtitle }}</p>
      </div>
      <button
        type="button"
        class="sidebar-collapse-btn"
        [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.aria-expanded]="!sidebarCollapsed"
        (click)="toggleSidebarCollapse()"
      >
        <i
          class="fa"
          [class.fa-angle-left]="!sidebarCollapsed"
          [class.fa-angle-right]="sidebarCollapsed"
          aria-hidden="true"
        ></i>
      </button>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      @for (item of sidebarMenu; track item.key) {
        <a
          class="sidebar-link"
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          [attr.title]="sidebarCollapsed && !mobileSidebarOpen ? item.label : null"
          (click)="closeMobileSidebar()"
        >
          <i class="fa {{ getSidebarIcon(item.icon) }}" aria-hidden="true"></i>
          <span class="sidebar-link__label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <button
        type="button"
        class="sidebar-link sidebar-link--muted"
        [attr.title]="sidebarCollapsed && !mobileSidebarOpen ? 'Settings' : null"
      >
        <i class="fa fa-cog" aria-hidden="true"></i>
        <span class="sidebar-link__label">Settings</span>
      </button>
      <button
        type="button"
        class="sidebar-link sidebar-link--danger"
        [attr.title]="sidebarCollapsed && !mobileSidebarOpen ? 'Log Out' : null"
        (click)="logout()"
      >
        <i class="fa fa-sign-out" aria-hidden="true"></i>
        <span class="sidebar-link__label">Log Out</span>
      </button>
    </div>
  </aside>

  <div class="dashboard-main">
    <header class="content-header">
      <div class="content-header__left">
        <button
          type="button"
          class="sidebar-toggle-btn"
          [attr.aria-label]="sidebarToggleLabel"
          [attr.aria-expanded]="isMobileViewport ? mobileSidebarOpen : !sidebarCollapsed"
          (click)="toggleSidebar()"
        >
          @if (isMobileViewport && mobileSidebarOpen) {
            <i class="fa fa-times" aria-hidden="true"></i>
          } @else if (!isMobileViewport && sidebarCollapsed) {
            <i class="fa fa-angle-right" aria-hidden="true"></i>
          } @else {
            <i class="fa fa-bars" aria-hidden="true"></i>
          }
        </button>
        <h2 class="content-header__title">Revo</h2>
      </div>

      <div class="content-header__actions">
        <button type="button" class="icon-btn" aria-label="Notifications">
          <i class="fa fa-bell-o" aria-hidden="true"></i>
          <span class="icon-btn__dot" aria-hidden="true"></span>
        </button>

        @if (role !== 1 && roles.length > 1) {
          <div class="role-switch">
            <i class="fa fa-briefcase" aria-hidden="true"></i>
            <select class="role-select" [value]="role" (change)="changeRole($event)">
              @for (r of roles; track r) {
                <option [value]="r" [selected]="r == role">{{ getRoleLabel(r) }}</option>
              }
            </select>
          </div>
        } @else {
          <button type="button" class="icon-btn" aria-label="Workspace">
            <i class="fa fa-briefcase" aria-hidden="true"></i>
          </button>
        }

        <div class="user-avatar" [attr.title]="userName">{{ userInitials }}</div>
      </div>
    </header>

    <main class="dashboard-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
